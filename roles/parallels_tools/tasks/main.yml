---
- name: Inspect Parallels Tools package in the guest
  ansible.builtin.command:
    argv:
      - dpkg-query
      - --show
      - "--showformat=${Status}"
      - parallels-tools
  register: parallels_tools_package
  changed_when: false
  failed_when: false

- name: Inspect Parallels Tools executable in the guest
  ansible.builtin.stat:
    path: /usr/bin/prltoolsd
  register: parallels_tools_executable

- name: Record whether Parallels Tools is installed
  ansible.builtin.set_fact:
    parallels_tools_installed: >-
      {{
        (parallels_tools_package.rc == 0 and
         "install ok installed" in parallels_tools_package.stdout) or
        (parallels_tools_executable.stat.executable | default(false))
      }}

- name: Inspect the installed Parallels Tools version
  ansible.builtin.command:
    argv:
      - cat
      - /usr/lib/parallels-tools/version
  register: parallels_tools_installed_version_result
  when: parallels_tools_installed | bool
  changed_when: false
  failed_when: false

- name: Record the installed Parallels Tools version
  ansible.builtin.set_fact:
    parallels_tools_installed_version: >-
      {{
        (parallels_tools_installed_version_result.stdout | default('') | trim)
        if (parallels_tools_installed | bool)
        else ''
      }}

- name: Inspect the bundled Parallels Tools ISO on the controller
  ansible.builtin.stat:
    path: "{{ parallels_tools_iso_path }}"
  register: parallels_tools_iso
  when:
    - not (parallels_tools_installed | bool) or
      update_parallels_tools_automatically | bool
  delegate_to: localhost
  become: false

- name: Verify the bundled Parallels Tools ISO is available
  ansible.builtin.assert:
    that:
      - parallels_tools_iso.stat.isreg | default(false)
    fail_msg: >-
      The ARM64 Parallels Tools ISO was not found at
      {{ parallels_tools_iso_path }} on the Ansible controller.
  when:
    - not (parallels_tools_installed | bool) or
      update_parallels_tools_automatically | bool
  delegate_to: localhost
  become: false

- name: Read the bundled Parallels Tools version
  ansible.builtin.command:
    argv:
      - "{{ parallels_bsdtar_path }}"
      - -xOf
      - "{{ parallels_tools_iso_path }}"
      - version
  register: parallels_tools_bundled_version_result
  when:
    - not (parallels_tools_installed | bool) or
      update_parallels_tools_automatically | bool
  changed_when: false
  delegate_to: localhost
  become: false

- name: Record the bundled Parallels Tools version
  ansible.builtin.set_fact:
    parallels_tools_bundled_version: >-
      {{ parallels_tools_bundled_version_result.stdout | default('') | trim }}
  when:
    - not (parallels_tools_installed | bool) or
      update_parallels_tools_automatically | bool

- name: Validate the bundled Parallels Tools version
  ansible.builtin.assert:
    that:
      - parallels_tools_bundled_version is
        match('^[0-9]+(?:\\.[0-9]+){3}$')
    fail_msg: >-
      Could not read a four-part Tools version from
      {{ parallels_tools_iso_path }}.
  when:
    - not (parallels_tools_installed | bool) or
      update_parallels_tools_automatically | bool

- name: Determine whether Parallels Tools needs an update
  ansible.builtin.set_fact:
    parallels_tools_update_required: >-
      {{
        (parallels_tools_installed | bool) and
        (update_parallels_tools_automatically | bool) and
        (
          parallels_tools_installed_version | length == 0 or
          parallels_tools_installed_version is
            version(parallels_tools_bundled_version, '<')
        )
      }}

- name: Make Parallels Tools installation media available
  when: not parallels_tools_installed | bool
  block:
    - name: Inspect the guest CD label
      ansible.builtin.command:
        argv:
          - /usr/sbin/blkid
          - --match-tag
          - LABEL
          - --output
          - value
          - /dev/sr0
      register: parallels_tools_cd_label
      changed_when: false
      failed_when: false

    - name: Attach the bundled Parallels Tools ISO to the VM
      ansible.builtin.command:
        argv:
          - "{{ parallels_prlctl_path }}"
          - set
          - "{{ parallels_vm_name }}"
          - --device-set
          - cdrom0
          - --image
          - "{{ parallels_tools_iso_path }}"
          - --connect
      when: parallels_tools_cd_label.stdout != "Parallels Tools"
      delegate_to: localhost
      become: false
      changed_when: true

    - name: Wait for the Parallels Tools disc in the guest
      ansible.builtin.command:
        argv:
          - /usr/sbin/blkid
          - --match-tag
          - LABEL
          - --output
          - value
          - /dev/sr0
      register: parallels_tools_cd_ready
      until: parallels_tools_cd_ready.stdout == "Parallels Tools"
      retries: 15
      delay: 1
      changed_when: false
      failed_when: false

    - name: Find an existing Parallels Tools disc mount
      ansible.builtin.command:
        argv:
          - findmnt
          - --raw
          - --noheadings
          - --source
          - /dev/sr0
          - --output
          - TARGET
      register: parallels_tools_existing_mounts
      changed_when: false
      failed_when: false

    - name: Create the Parallels Tools mount point
      ansible.builtin.file:
        path: "{{ parallels_tools_mount_path }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: parallels_tools_existing_mounts.stdout_lines | length == 0

    # This is intentionally a temporary, non-fstab mount; keeping it as a
    # command avoids adding ansible.posix solely for installer media.
    - name: Mount the Parallels Tools disc # noqa command-instead-of-module
      ansible.builtin.command:
        argv:
          - mount
          - --options
          - ro,exec
          - /dev/sr0
          - "{{ parallels_tools_mount_path }}"
      when: parallels_tools_existing_mounts.stdout_lines | length == 0
      changed_when: true

    - name: Record the Parallels Tools media path
      ansible.builtin.set_fact:
        parallels_tools_media_path: >-
          {{
            (parallels_tools_existing_mounts.stdout_lines | first)
            if (parallels_tools_existing_mounts.stdout_lines | length > 0)
            else parallels_tools_mount_path
          }}

    - name: Inspect the Parallels Tools installer
      ansible.builtin.stat:
        path: "{{ parallels_tools_media_path }}/install"
      register: parallels_tools_installer

    - name: Verify the Parallels Tools installer is accessible
      ansible.builtin.assert:
        that:
          - parallels_tools_installer.stat.isreg | default(false)
        fail_msg: >-
          The Parallels Tools disc is present at
          {{ parallels_tools_media_path }}, but its installer was not found.

    - name: Install Parallels Tools unattended
      ansible.builtin.command:
        argv:
          - "{{ parallels_tools_media_path }}/install"
          - --install-unattended
          - --verbose
      environment:
        DEBIAN_FRONTEND: noninteractive
      when: install_parallels_tools_automatically | bool
      register: parallels_tools_install_result
      changed_when: parallels_tools_install_result.rc == 0

    - name: Verify the unattended Parallels Tools installation
      ansible.builtin.stat:
        path: /usr/bin/prltoolsd
      register: parallels_tools_installed_executable
      when: install_parallels_tools_automatically | bool

    - name: Confirm Parallels Tools was installed
      ansible.builtin.assert:
        that:
          - parallels_tools_installed_executable.stat.executable | default(false)
        fail_msg: >-
          The Parallels Tools installer completed but /usr/bin/prltoolsd is
          unavailable. Inspect /var/log/parallels-tools-install.log.
      when: install_parallels_tools_automatically | bool

    - name: Report the Parallels Tools installer location
      ansible.builtin.debug:
        msg: >-
          Parallels Tools is not installed. Its installer is available at
          {{ parallels_tools_media_path }}/install; run it interactively with
          sudo, then reboot the VM.
      when: not install_parallels_tools_automatically | bool

- name: Update Parallels Tools from the host bundle
  when: parallels_tools_update_required | bool
  block:
    - name: Verify the Parallels VM name is configured for the update
      ansible.builtin.assert:
        that:
          - parallels_vm_name != "YOUR_VM_NAME"
          - parallels_vm_name | length > 0
        fail_msg: >-
          Set parallels_vm_name to the exact Parallels Desktop VM name before
          updating Parallels Tools.

    - name: Request the Parallels Tools update from the controller
      ansible.builtin.command:
        argv:
          - "{{ parallels_prlctl_path }}"
          - installtools
          - "{{ parallels_vm_name }}"
      delegate_to: localhost
      become: false
      changed_when: true

    - name: Wait for the bundled Parallels Tools version in the guest
      ansible.builtin.command:
        argv:
          - cat
          - /usr/lib/parallels-tools/version
      register: parallels_tools_updated_version_result
      until: >-
        parallels_tools_updated_version_result.stdout | trim ==
        parallels_tools_bundled_version
      retries: 60
      delay: 5
      changed_when: false
      failed_when: false

    - name: Confirm the Parallels Tools update completed
      ansible.builtin.assert:
        that:
          - parallels_tools_updated_version_result.rc == 0
          - parallels_tools_updated_version_result.stdout | trim ==
            parallels_tools_bundled_version
        fail_msg: >-
          Parallels Tools did not reach version
          {{ parallels_tools_bundled_version }} within five minutes. Inspect
          /var/log/parallels-tools-install.log in the guest.

    - name: Ensure the Parallels Tools service is active
      ansible.builtin.systemd:
        name: prltoolsd.service
        enabled: true
        state: started

- name: Report the installed Parallels Tools version
  ansible.builtin.debug:
    msg: >-
      Parallels Tools {{ parallels_tools_installed_version }} already matches
      or is newer than the host bundle {{ parallels_tools_bundled_version }}.
  when:
    - parallels_tools_installed | bool
    - update_parallels_tools_automatically | bool
    - not (parallels_tools_update_required | bool)
