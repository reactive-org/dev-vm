---
- name: Validate the selected desktop session
  ansible.builtin.assert:
    that:
      - desktop_session in ["hyprland", "i3-x11"]
    fail_msg: desktop_session must be hyprland or i3-x11.

- name: Install lean Hyprland desktop packages
  ansible.builtin.apt:
    name:
      - adwaita-icon-theme
      - cliphist
      - fonts-font-awesome
      - fonts-jetbrains-mono
      - fonts-noto-color-emoji
      - fuzzel
      - greetd
      - grim
      - hyprland
      - hyprland-qtutils
      - hyprpolkitagent
      - mako-notifier
      - nautilus
      - pavucontrol
      - pipewire
      - pipewire-pulse
      - playerctl
      - polkitd
      - qt6-wayland
      - rtkit
      - slurp
      - swayidle
      - swaylock
      - waybar
      - wireplumber
      - wl-clipboard
      - xdg-desktop-portal
      - xdg-desktop-portal-gtk
      - xdg-desktop-portal-hyprland
      - xdg-user-dirs
      - xdg-utils
      - xwayland
    state: present
    install_recommends: false

- name: Install lean i3 Xorg session packages
  ansible.builtin.apt:
    name:
      - dbus-x11
      - dunst
      - flameshot
      - i3
      - i3lock
      - policykit-1-gnome
      - rofi
      - xclip
      - xinit
      - xorg
    state: present
    install_recommends: false
  when: desktop_session == "i3-x11"
  tags: [i3_x11]

- name: Remove conflicting GNOME desktop components
  ansible.builtin.apt:
    name:
      - gdm3
      - gnome-control-center
      - gnome-control-center-data
      - gnome-control-center-faces
      - gnome-remote-desktop
      - gnome-session-bin
      - gnome-session-common
      - gnome-shell
      - gnome-shell-common
      - gnome-shell-ubuntu-extensions
      - modemmanager
      - network-manager
      - network-manager-l10n
      - network-manager-pptp
      - nm-connection-editor
      - ubuntu-session
      - xdg-desktop-portal-gnome
    state: absent
    purge: true

- name: Remove superseded Ghostty terminal emulator
  tags: [kitty]
  ansible.builtin.apt:
    name: ghostty
    state: absent
    purge: true

- name: Remove project-managed Ghostty user files
  tags: [kitty]
  ansible.builtin.file:
    path: "{{ workstation_home }}/{{ item }}"
    state: absent
  loop:
    - .config/ghostty
    - .local/bin/ghostty
    - .local/share/applications/com.mitchellh.ghostty.desktop

- name: Install kitty terminal emulator
  tags: [kitty]
  ansible.builtin.apt:
    name: kitty
    state: present
    install_recommends: false

- name: Validate kitty display backend
  tags: [kitty]
  ansible.builtin.assert:
    that:
      - kitty_display_server in ["wayland", "x11", "auto"]
    fail_msg: kitty_display_server must be wayland, x11, or auto.

- name: Create kitty user directories
  tags: [kitty]
  ansible.builtin.file:
    path: "{{ workstation_home }}/{{ item }}"
    state: directory
    owner: "{{ workstation_user }}"
    group: "{{ workstation_group }}"
    mode: "0755"
  loop:
    - .config/fuzzel
    - .config/hypr
    - .config/kitty
    - .local/bin
    - .local/share/applications

- name: Install kitty configuration and launcher entry
  tags: [kitty]
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ workstation_home }}/{{ item.dest }}"
    owner: "{{ workstation_user }}"
    group: "{{ workstation_group }}"
    mode: "{{ item.mode }}"
  loop:
    - src: kitty.conf.j2
      dest: .config/kitty/kitty.conf
      mode: "0644"
    - src: kitty-wrapper.sh.j2
      dest: .local/bin/kitty
      mode: "0755"
    - src: kitty.desktop.j2
      dest: .local/share/applications/kitty.desktop
      mode: "0644"

- name: Create desktop configuration directories
  tags: [onepassword]
  ansible.builtin.file:
    path: "{{ workstation_home }}/{{ item }}"
    state: directory
    owner: "{{ workstation_user }}"
    group: "{{ workstation_group }}"
    mode: "0755"
  loop:
    - .local/bin
    - .local/share/applications
    - .local/state/dev-ubuntu
    - .config/autostart
    - .config/fuzzel
    - .config/gtk-3.0
    - .config/gtk-4.0
    - .config/hypr
    - .config/i3
    - .config/dunst
    - .config/mako
    - .config/systemd/user
    - .config/waybar

- name: Install user desktop configuration
  tags: [onepassword]
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ workstation_home }}/{{ item.dest }}"
    owner: "{{ workstation_user }}"
    group: "{{ workstation_group }}"
    mode: "0644"
  loop:
    - {src: gtk-settings.ini.j2, dest: .config/gtk-3.0/settings.ini}
    - {src: gtk-settings.ini.j2, dest: .config/gtk-4.0/settings.ini}
    - {src: mako.conf.j2, dest: .config/mako/config}
    - {src: waybar.jsonc.j2, dest: .config/waybar/config.jsonc}
    - {src: waybar.css.j2, dest: .config/waybar/style.css}

- name: Install fuzzel configuration
  tags: [onepassword, kitty]
  ansible.builtin.template:
    src: fuzzel.ini.j2
    dest: "{{ workstation_home }}/.config/fuzzel/fuzzel.ini"
    owner: "{{ workstation_user }}"
    group: "{{ workstation_group }}"
    mode: "0644"

- name: Install Hyprland configuration
  tags: [onepassword, kitty, hyprland_config]
  ansible.builtin.template:
    src: hyprland.conf.j2
    dest: "{{ workstation_home }}/.config/hypr/hyprland.conf"
    owner: "{{ workstation_user }}"
    group: "{{ workstation_group }}"
    mode: "0644"

- name: Install i3 Xorg session configuration
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ workstation_home }}/{{ item.dest }}"
    owner: "{{ workstation_user }}"
    group: "{{ workstation_group }}"
    mode: "{{ item.mode }}"
  loop:
    - src: i3-config.j2
      dest: .config/i3/config
      mode: "0644"
    - src: dunstrc.j2
      dest: .config/dunst/dunstrc
      mode: "0644"
    - src: xinitrc.j2
      dest: .xinitrc
      mode: "0755"
  when: desktop_session == "i3-x11"
  tags: [i3_x11]

- name: Install Parallels Hyprland user services
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ workstation_home }}/.config/systemd/user/{{ item.dest }}"
    owner: "{{ workstation_user }}"
    group: "{{ workstation_group }}"
    mode: "0644"
  loop:
    - src: parallels-dynamic-resolution.service.j2
      dest: parallels-dynamic-resolution.service
    - src: parallels-prlcc-x11.service.j2
      dest: parallels-prlcc-x11.service
    - src: parallels-prlcp-wayland.service.j2
      dest: parallels-prlcp-wayland.service
    - src: parallels-prldnd-wayland.service.j2
      dest: parallels-prldnd-wayland.service
  notify: Restart active Parallels clipboard bridge
  when: enable_parallels_hyprland_integration | bool
  tags: [parallels_dynamic_resolution]

- name: Install Parallels i3 Xorg user services
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ workstation_home }}/.config/systemd/user/{{ item.dest }}"
    owner: "{{ workstation_user }}"
    group: "{{ workstation_group }}"
    mode: "0644"
  loop:
    - src: parallels-prlcp-x11.service.j2
      dest: parallels-prlcp-x11.service
    - src: parallels-prldnd-x11.service.j2
      dest: parallels-prldnd-x11.service
  notify: Restart active Parallels clipboard bridge
  when:
    - desktop_session == "i3-x11"
    - enable_parallels_x11_integration | bool
  tags: [i3_x11, parallels_dynamic_resolution]

- name: Disable the incompatible stock Parallels desktop autostart
  ansible.builtin.template:
    src: parallels-prlcc.desktop.j2
    dest: "{{ workstation_home }}/.config/autostart/prlcc.desktop"
    owner: "{{ workstation_user }}"
    group: "{{ workstation_group }}"
    mode: "0644"
  when: >-
    enable_parallels_hyprland_integration | bool or
    enable_parallels_x11_integration | bool
  tags: [parallels_dynamic_resolution]

- name: Install the Parallels Hyprland dynamic-resolution bridge
  ansible.builtin.template:
    src: parallels-hyprland-dynamic-resolution.sh.j2
    dest: >-
      {{ workstation_home }}/.local/bin/parallels-hyprland-dynamic-resolution
    owner: "{{ workstation_user }}"
    group: "{{ workstation_group }}"
    mode: "0755"
  when:
    - enable_parallels_hyprland_integration | bool
    - parallels_dynamic_resolution_enabled | bool
  tags: [parallels_dynamic_resolution]

- name: Initialize the runtime Parallels monitor rule
  ansible.builtin.template:
    src: parallels-monitor.conf.j2
    dest: >-
      {{ workstation_home }}/.local/state/dev-ubuntu/parallels-monitor.conf
    force: false
    owner: "{{ workstation_user }}"
    group: "{{ workstation_group }}"
    mode: "0644"
  when:
    - enable_parallels_hyprland_integration | bool
    - parallels_dynamic_resolution_enabled | bool
  tags: [parallels_dynamic_resolution]

- name: Install the fixed Parallels monitor rule
  ansible.builtin.template:
    src: parallels-monitor.conf.j2
    dest: >-
      {{ workstation_home }}/.local/state/dev-ubuntu/parallels-monitor.conf
    owner: "{{ workstation_user }}"
    group: "{{ workstation_group }}"
    mode: "0644"
  when:
    - enable_parallels_hyprland_integration | bool
    - not (parallels_dynamic_resolution_enabled | bool)
  tags: [parallels_dynamic_resolution]

- name: Configure greetd
  ansible.builtin.template:
    src: greetd.toml.j2
    dest: /etc/greetd/config.toml
    owner: root
    group: root
    mode: "0644"
  notify: Restart greetd

- name: Inspect the registered display manager
  ansible.builtin.stat:
    path: /etc/systemd/system/display-manager.service
    follow: false
  register: desktop_display_manager

- name: Remove stale GDM display manager registration
  ansible.builtin.file:
    path: /etc/systemd/system/display-manager.service
    state: absent
  when:
    - desktop_display_manager.stat.islnk | default(false)
    - "'gdm' in (desktop_display_manager.stat.lnk_source | default(''))"

- name: Enable and start greetd
  ansible.builtin.systemd:
    name: greetd
    enabled: true
    force: true
    state: started

- name: Use graphical boot target
  ansible.builtin.file:
    src: /lib/systemd/system/graphical.target
    dest: /etc/systemd/system/default.target
    state: link
    force: true
