---
- name: Restart greetd
  ansible.builtin.systemd:
    name: greetd
    state: restarted

- name: Inspect the workstation user manager
  ansible.builtin.stat:
    path: >-
      /run/user/{{ ansible_facts["getent_passwd"][workstation_user][1] }}/bus
  register: workstation_user_bus
  listen: Restart active Parallels clipboard bridge

- name: Restart the active Parallels clipboard bridge
  ansible.builtin.systemd:
    name: >-
      parallels-prlcp-{{ 'x11' if desktop_session == 'i3-x11' else 'wayland' }}.service
    scope: user
    daemon_reload: true
    state: restarted
  become: true
  become_user: "{{ workstation_user }}"
  environment:
    XDG_RUNTIME_DIR: >-
      /run/user/{{ ansible_facts["getent_passwd"][workstation_user][1] }}
    DBUS_SESSION_BUS_ADDRESS: >-
      unix:path=/run/user/{{ ansible_facts["getent_passwd"][workstation_user][1] }}/bus
  when: workstation_user_bus.stat.exists | default(false)
  listen: Restart active Parallels clipboard bridge
