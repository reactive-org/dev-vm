# Project development tools. Installation is opt-in: mise trust && mise install.
# Omarchy VM Manager, Docker, Git, make, Bash and SSH remain host prerequisites.
[settings]
auto_install = false

[tools]
python = "3.14.10"
lua = "5.5.1"
uv = "0.13.6"
"pypi:ansible-core" = "2.21.5"
shellcheck = "0.11.0"
yamllint = "1.38.0"

[tasks.test]
description = "Run the Omarchy test suite, including Lua layout tests"
run = "make test-omarchy"

[tasks.syntax-check]
description = "Check Ansible playbook syntax"
run = "make syntax-check"

[tasks.check]
description = "Run Ansible syntax checks and the Omarchy tests"
depends = ["syntax-check", "test"]
