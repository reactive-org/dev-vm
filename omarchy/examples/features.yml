---
# Copy to the ignored omarchy/local/features.yml and select it with OMARCHY_VARS_FILE.
# This configures features; OMARCHY_FEATURES or --tags selects which ones run.
omarchy_browsers: [chromium, firefox]
omarchy_languages:
  node: ""
  python: "3"
omarchy_agents:
  claude: ""
  codex: ""
  opencode: ""
omarchy_credential_packages: [1password, 1password-cli]
omarchy_shell: zsh # zsh, bash, or keep the current login shell
omarchy_oh_my_zsh: true # Optional zsh completion/plugins
omarchy_oh_my_zsh_plugins: null # Preserve existing plugins, default [git] on a fresh shell; [] enables none.
omarchy_oh_my_zsh_update_mode: reminder # prompt, auto, reminder, disabled; "" preserves native policy.
omarchy_starship: true # Optional zsh prompt
omarchy_starship_config: "" # Optional native TOML; see the setup.yml example.
omarchy_foot_font_size: "12"
omarchy_idle_mode: host
omarchy_theme: ""
omarchy_layout_file: ""
omarchy_remove_layout: false
