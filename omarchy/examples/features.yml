---
# Copy to the ignored omarchy/local/features.yml and select it with OMARCHY_VARS_FILE.
# This configures features; OMARCHY_FEATURES or --tags selects which ones run.
omarchy_browsers: [chromium, firefox]
omarchy_languages:
  node: ""
  python: "3"
omarchy_agents:
  claude: ""
  codex: ""
  opencode: ""
omarchy_credential_packages: [1password, 1password-cli]
omarchy_foot_font_size: "16"
omarchy_idle_mode: host
omarchy_theme: ""
omarchy_layout_file: ""
omarchy_remove_layout: false
