# yaml-language-server: $schema=../features/selection.schema.json
---
# Copy to omarchy/local/setup.yml, then use OMARCHY_SETUP_FILE.
# Profiles select features; options only configure them.
schema_version: 1
profiles: [web]
features:
  enable: [agents]
  disable: []
options:
  workstation:
    shell: zsh # Override with bash or keep.
    oh_my_zsh: true # Used only with zsh; completion/plugins.
    oh_my_zsh_plugins: [git, docker, docker-compose] # null preserves existing plugins; [] enables none.
    oh_my_zsh_update_mode: reminder # prompt, auto, reminder, disabled; empty preserves native policy.
    starship: true # Used only with zsh; prompt, with the Oh My Zsh theme disabled.
    starship_config: | # Omit or use "" to preserve personal Starship configuration.
      add_newline = false
      format = '$directory$git_branch$git_status$cmd_duration$line_break$character'

      [directory]
      truncation_length = 1
      substitutions = [
        { from = '([^/]{20})[^/]+', to = '${1}…', regex = true },
      ]

      [git_branch]
      format = '[$symbol$branch]($style) '
      truncation_length = 24
      truncation_symbol = '…'

      [cmd_duration]
      format = '[$duration]($style) '

      [character]
      success_symbol = '[❯](bold green)'
      error_symbol = '[❯](bold red)'
  browsers:
    browsers: [firefox]
  languages:
    tools:
      node: "24"
  agents:
    tools:
      codex: ""
